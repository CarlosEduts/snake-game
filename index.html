<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Jogo da Cobrinha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style/global.css" />
  </head>
  <body>
    <div class="container in-game">
      <header class="game-title">
        <p class="game-title_eyebrow">Registro de campo Nº 001</p>
        <h1 class="game-title_name">Jogo da Cobrinha</h1>
      </header>

      <div class="game-status">
        <p class="game-status_points">1</p>
      </div>

      <div class="game">
        <canvas
          class="game__canvas"
          width="400"
          height="400"
          id="canvas"
        ></canvas>
      </div>

      <!-- Controles do jogo (apenas mobile) -->
      <div class="game-controls">
        <div
          class="game-controls_btn"
          data-direction="up"
          aria-label="Mover para cima"
          role="button"
        ></div>
        <div
          class="game-controls_btn"
          data-direction="left"
          aria-label="Mover para esquerda"
          role="button"
        ></div>
        <div
          class="game-controls_btn"
          data-direction="down"
          aria-label="Mover para baixo"
          role="button"
        ></div>
        <div
          class="game-controls_btn"
          data-direction="right"
          aria-label="Mover para direita"
          role="button"
        ></div>
      </div>

      <footer>
        <span>v1.0.0</span>
        <span aria-hidden="true">·</span>
        <span>Carlos Trindade</span>
        <span aria-hidden="true">·</span>
        <span>&copy; 2026</span>
        <span aria-hidden="true">·</span>
        <a
          href="https://github.com/CarlosEduts/snake-game"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </footer>
    </div>

    <!-- Tela de game-over -->
    <div class="game-over">
      <div class="game-over__card">
        <p class="game-over__eyebrow">Espécime perdido</p>
        <h2 class="game-over__title">Fim de jogo</h2>
        <p class="game-over__message"></p>
        <div class="game-over__score">
          <span>Pontuação final</span>
          <strong id="finalScore">1</strong>
        </div>
        <button class="game-over__restart" id="restartButton" type="button">
          Nova tentativa
        </button>
      </div>
    </div>

    <script type="module" src="./build/main.js"></script>
  </body>
</html>
